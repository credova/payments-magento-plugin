---
name: Pull Request

on:
  pull_request:
    branches: [master]

concurrency:
  group: '${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}'
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  ci:
    uses: credova/platform-workflows/.github/workflows/php-pull-request.yaml@v1
    # No secrets passed: container: false skips the image build, and WarpBuild
    # runners are provisioned org-wide via the WarpBuild GitHub App.
    with:
      container: false
      runner: warp-ubuntu-2404-x64-4x
      php-version: '8.3'
      # phpcs against the Magento2 standard (phpcs.xml) plus a PHP 8.1–8.3
      # compatibility pass (phpcs-compat.xml), matching the sibling plugins.
      lint-command: composer install --prefer-dist --no-progress --no-interaction && make lint && make compat
      # Unit tests only. Codeception acceptance suite is not run anywhere yet — https://app.shortcut.com/publicsq/story/88251
      test-command: composer install --prefer-dist --no-progress --no-interaction && make unit-test-verbose
