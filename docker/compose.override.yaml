# docker-magento loads compose.override.yaml from magento-install/. bin/dev-up links this file there.
services:
  # The stock probe runs as root. On a new volume it can create ~/.erlang.cookie as root before the server
  # does, and the server (as rabbitmq) then fails with eacces. Run the probe as rabbitmq.
  rabbitmq:
    healthcheck:
      test: ["CMD-SHELL", "su-exec rabbitmq rabbitmq-diagnostics -q ping"]

  # The test profile keeps Selenium off a plain `dev:up`.
  selenium:
    image: selenium/standalone-chromium:152.0-20260909
    profiles: [test]
    shm_size: 2g
    # The browser reaches the store through the host's ports 80 and 443, as a developer does.
    extra_hosts:
      - 'magento.test:host-gateway'
    ports:
      - '127.0.0.1:4444:4444' # WebDriver
      - '127.0.0.1:7900:7900' # noVNC: watch the browser at http://localhost:7900 (password: secret)
